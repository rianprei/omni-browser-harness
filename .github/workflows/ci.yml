name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the package and test extras
        run: pip install -e ".[test]"

      - name: Byte-compile the sources
        run: python3 -m compileall -q src

      - name: Run the test suite
        run: python3 -m pytest -q
